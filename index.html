<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentFlow - Property & Rental Management</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="description" content="Offline-first property and rental management software for landlords and property agencies." />
    <meta property="og:title" content="RentFlow - Property & Rental Management" />
    <meta property="og:description" content="Offline-first property and rental management software for landlords and property agencies." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('rentflow-theme') || localStorage.getItem('rentflow_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
